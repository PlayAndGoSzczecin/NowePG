<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka Gier Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.07); /* Nieco wyraźniejsze karty */
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* NAPRAWIONE TŁO: Teraz na 100% z tyłu i bez agresywnego filtra */
        .bg-fixed-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Gwarancja, że jest pod wszystkim */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translateZ(0); 
            opacity: 0.5; /* Subtelne tło, by nie gryzło się z tekstem */
        }

        .container {
            position: relative;
            z-index: 1; /* Treść zawsze nad tłem */
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding-top: 60px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 80px;
        }

        /* Karty w stylu Glassmorphism */
        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.12);
        }

        .game-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .game-info {
            padding: 15px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }

        .game-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        footer {
            padding: 80px 0;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        footer.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="bg-layer" class="bg-fixed-layer"></div>

    <div class="container">
        <header>
            <h1 id="site-title">Premium Gallery</h1>
            <p id="site-desc" style="color: var(--text-dim)">Ekskluzywny przegląd biblioteki</p>
        </header>

        <div class="games-grid" id="games-grid">
            <!-- Tutaj JS wstrzyknie karty -->
        </div>

        <footer id="main-footer">
            <h2 id="footer-title">Koniec Kolekcji</h2>
            <p id="footer-text">2024 • Wszelkie prawa zastrzeżone</p>
        </footer>
    </div>

    <script>
        // Twoje dane (zmień URL tła na właściwy!)
        const data = {
            settings: {
                TytulStrony: "Moja Kolekcja Gier",
                OpisStrony: "Zbiór najlepszych tytułów",
                TloStronyURL: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070", 
                StopkaTytul: "Dziękuję za oglądanie",
                StopkaTekst: "Kolekcja aktualizowana na bieżąco"
            },
            games: Array.from({ length: 12 }, (_, i) => ({
                TytulGry: `Super Gra ${i + 1}`,
                MiniaturkaURL: `https://picsum.photos/seed/${i+10}/600/338`
            }))
        };

        function render() {
            document.getElementById('site-title').textContent = data.settings.TytulStrony;
            document.getElementById('site-desc').textContent = data.settings.OpisStrony;
            document.getElementById('bg-layer').style.backgroundImage = `url('${data.settings.TloStronyURL}')`;
            
            const grid = document.getElementById('games-grid');
            grid.innerHTML = data.games.map(g => `
                <div class="game-card">
                    <img src="${g.MiniaturkaURL}" class="game-img" alt="">
                    <div class="game-info">
                        <div class="game-title">${g.TytulGry}</div>
                    </div>
                </div>
            `).join('');

            // Prosty mechanizm pokazania stopki przy scrollu
            const observer = new IntersectionObserver((entries) => {
                if(entries[0].isIntersecting) document.getElementById('main-footer').classList.add('visible');
            }, { threshold: 0.1 });
            observer.observe(document.getElementById('main-footer'));
        }

        render();
    </script>
</body>
</html>
