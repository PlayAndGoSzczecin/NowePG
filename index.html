<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteka Gier Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* NAPRAWA TŁA: Używamy dedykowanej warstwy zamiast background-attachment: fixed */
        .bg-fixed-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translateZ(0); /* Akceleracja sprzętowa */
            filter: brightness(0.4);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding-top: 40px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .game-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
        }

        .game-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        /* NAPRAWA STOPKI: Płynne pojawianie się */
        footer {
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            opacity: 0; /* Domyślnie ukryta */
            transition: opacity 1s ease-out;
            pointer-events: none;
        }

        footer.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .footer-content h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Warstwa tła -->
    <div id="bg-layer" class="bg-fixed-layer"></div>

    <div class="container">
        <header>
            <h1 id="site-title">Moja Kolekcja</h1>
            <p id="site-desc" style="color: var(--text-dim)">Ładowanie biblioteki...</p>
        </header>

        <div class="games-grid" id="games-grid">
            <!-- Gry zostaną wstrzyknięte tutaj -->
        </div>

        <footer id="main-footer">
            <div class="footer-content">
                <h2 id="footer-title">Dziękujemy za wizytę</h2>
                <p id="footer-text" style="color: var(--text-dim)">Kolekcja gier 2024</p>
            </div>
        </footer>
    </div>

    <script>
        // Symulacja danych z bazy (tutaj podepnij swoje dane)
        const mockData = {
            settings: {
                TytulStrony: "Premium Game Library",
                OpisStrony: "Ekskluzywny przegląd mojej cyfrowej biblioteki",
                TloStronyURL: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=2070",
                StopkaTytul: "To już koniec kolekcji",
                StopkaTekst: "Aktualizowane raz w tygodniu"
            },
            games: Array.from({ length: 24 }, (_, i) => ({
                TytulGry: `Gra Numer ${i + 1}`,
                MiniaturkaURL: `https://picsum.photos/seed/${i+40}/400/225`
            }))
        };

        let footerObserver;

        function init() {
            renderUI(mockData);
            setupFooterObserver();
        }

        function renderUI(data) {
            const { settings, games } = data;

            // Ustawienia strony
            document.getElementById('site-title').textContent = settings.TytulStrony;
            document.getElementById('site-desc').textContent = settings.OpisStrony;
            document.getElementById('footer-title').textContent = settings.StopkaTytul;
            document.getElementById('footer-text').textContent = settings.StopkaTekst;

            // NAPRAWA TŁA: Dynamiczne przypisanie
            if (settings.TloStronyURL) {
                document.getElementById('bg-layer').style.backgroundImage = `url('${settings.TloStronyURL}')`;
            }

            // Renderowanie gier
            const grid = document.getElementById('games-grid');
            grid.innerHTML = games.map(game => `
                <div class="game-card">
                    <img src="${game.MiniaturkaURL}" class="game-img" alt="${game.TytulGry}" loading="lazy">
                    <div class="game-info">
                        <div class="game-title">${game.TytulGry}</div>
                    </div>
                </div>
            `).join('');
        }

        // NAPRAWA STOPKI: Obserwujemy samą stopkę
        function setupFooterObserver() {
            const footer = document.getElementById('main-footer');
            
            if (footerObserver) footerObserver.disconnect();

            const options = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1 // Pokaż, gdy 10% stopki jest widoczne
            };

            footerObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        footer.classList.add('visible');
                    }
                });
            }, options);

            footerObserver.observe(footer);
        }

        // Uruchomienie
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
